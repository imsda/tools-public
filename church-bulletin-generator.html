      function applyState(data) {
        const sample = getSampleState();
        const source = migrateLegacyState(data && typeof data === "object" ? data : sample) || sample;
        layoutMode = normalizeLayoutMode(source.layoutMode);
        if (layoutModeSelect) layoutModeSelect.value = layoutMode;
        const rawSections = Array.isArray(source.sections) ? source.sections : sample.sections;
        sections = rawSections.map(sanitizeSection).filter(Boolean);
        if (!sections.length) sections = sample.sections.map(sanitizeSection).filter(Boolean);

        const hasChurch = sections.some(s => s.kind === "church-info");
        const hasSermon = sections.some(s => s.kind === "sermon-info");
        if (!hasChurch) sections.unshift(sanitizeSection(getSampleState().sections[0]));
        if (!hasSermon) sections.splice(1, 0, sanitizeSection(getSampleState().sections[1]));
        normalizeFrontImageOwner();
        normalizeSectionsOrder();
      }

      function applyLayoutMode(nextMode) {
        const mode = normalizeLayoutMode(nextMode);
        if (mode === layoutMode) return;
        layoutMode = mode;
        sections = sections.map(section => {
          const clone = { ...section };
          if (clone.kind === "dynamic" && clone.type === "front-image") {
            clone.placement = layoutMode === "trifold-legal" ? "front-right" : "front-cover";
            return clone;
          }
          clone.placement = mapPlacementToMode(clone.placement, layoutMode);
          return clone;
        });

        const blob = new Blob([payload], { type: "application/json" });

        probe.style.visibility = "hidden";
        probe.style.pointerEvents = "none";
        probe.innerHTML = printHtml;
        document.body.appendChild(probe);
        const results = detectPanelOverflow(probe).map(item => ({ panelName: item.panelName, overflowPx: item.overflowPx }));
        probe.remove();
        return results;

      function getWordPageSections(state) {
        if (layoutMode === "trifold-legal") {
          const tri = { "front-left": [], "front-center": [], "front-right": [], "back-left": [], "back-center": [], "back-right": [] };
          const frontImageOwner = getFrontImageOwner(state.sections);
          const frontImageActive = !!(frontImageOwner && frontImageOwner.visible);
          (state.sections || []).forEach(section => {
            if (!section || !section.visible || sectionIsEmpty(section)) return;
            if (section.kind === "dynamic" && section.type === "front-image") {
              if (!frontImageOwner || section.id !== frontImageOwner.id) return;
              tri["front-right"] = [section];
              return;
            }
            if (frontImageActive && section.placement === "front-right") return;
            const key = TRI_FOLD_PLACEMENTS.includes(section.placement) ? section.placement : "back-center";
            tri[key].push(section);
          });
          return tri;
        }
        const pageBuckets = { page1: [], page2: [], page3: [], page4: [] };
        const frontImageOwner = getFrontImageOwner(state.sections);
        const frontImageActive = !!(frontImageOwner && frontImageOwner.visible);
        (state.sections || []).forEach(section => {
          if (!section || !section.visible || sectionIsEmpty(section)) return;
          if (section.kind === "dynamic" && section.type === "front-image") {
            if (!frontImageOwner || section.id !== frontImageOwner.id) return;
            pageBuckets.page1 = [section];
            return;
          }
          if (frontImageActive && section.placement === "front-cover") return;
          const key = placementMap[section.placement] || "page2";
          pageBuckets[key].push(section);
        });
        return pageBuckets;
      }

      function textToWordParagraphs(text) {
        return String(text || "").split(/\r?\n/).map(line => `<p style="margin:0 0 6pt 0;line-height:1.25;">${esc(line)}</p>`).join("") || `<p style="margin:0 0 6pt 0;line-height:1.25;"></p>`;
      }

      async function getDefaultFrontImageDataUrl() {
        if (defaultFrontImageDataUrlCache) return defaultFrontImageDataUrlCache;
        if (defaultFrontImageDataUrlPromise) return defaultFrontImageDataUrlPromise;
        defaultFrontImageDataUrlPromise = (async () => {
          try {
            const response = await fetch(FRONT_IMAGE_DEFAULT_SRC);
            if (!response.ok) throw new Error(`Failed to fetch default image: ${response.status}`);
            const blob = await response.blob();
            const dataUrl = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(String(reader.result || ""));
              reader.onerror = () => reject(new Error("Failed to read default image data."));
              reader.readAsDataURL(blob);
            });
            defaultFrontImageDataUrlCache = dataUrl;
            return dataUrl;
          } catch (error) {
            console.warn("Default front image conversion failed for Word export.", error);
            return "";
          } finally {
            defaultFrontImageDataUrlPromise = null;
          }
        })();
        return defaultFrontImageDataUrlPromise;
      }

      async function resolveExportImageSrc(src) {
        const raw = String(src || "").trim();
        if (!raw) return "";
        if (/^data:/i.test(raw)) return raw;
        if (raw === FRONT_IMAGE_DEFAULT_SRC) {
          const embedded = await getDefaultFrontImageDataUrl();
          return embedded || raw;
        }
        if (exportImageDataUrlCache.has(raw)) return exportImageDataUrlCache.get(raw) || raw;
        try {
          const response = await fetch(raw, { mode: "cors" });
          if (!response.ok) throw new Error(`Image fetch failed: ${response.status}`);
          const blob = await response.blob();
          const embedded = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result || ""));
            reader.onerror = () => reject(new Error("Failed to read image data."));
            reader.readAsDataURL(blob);
          });
          const finalSrc = embedded || raw;
          exportImageDataUrlCache.set(raw, finalSrc);
          return finalSrc;
        } catch {
          exportImageDataUrlCache.set(raw, raw);
          return raw;
        }
      }

      async function buildResolvedPrintState(state) {
        const source = migrateLegacyState(state && typeof state === "object" ? state : getState());
        const nextState = JSON.parse(JSON.stringify(source));
        const tasks = [];
        (nextState.sections || []).forEach(section => {
          if (!section || !section.data) return;
          if (section.type === "image" || section.type === "front-image") {
            tasks.push((async () => {
              const src = String((section.data && section.data.src) || "").trim() || (section.type === "front-image" ? FRONT_IMAGE_DEFAULT_SRC : "");
              if (!src) return;
              const resolved = await resolveExportImageSrc(src);
              if (resolved) section.data.src = resolved;
            })());
          }
          if (section.kind === "church-info" && section.data.logoUrl) {
            tasks.push((async () => {
              const resolved = await resolveExportImageSrc(section.data.logoUrl);
              if (resolved) section.data.logoUrl = resolved;
            })());
          }
        });
        await Promise.all(tasks);
        return nextState;
      }

      async function buildWordImageHtml(src, alt, options = {}) {
        const resolvedSrc = await resolveExportImageSrc(src);
        if (!resolvedSrc) return "";
        const safeAlt = String(alt || "").trim() || "Bulletin image";
        const maxWidth = options.maxWidth || APP_CONFIG.wordExportImage.wordImageMaxWidth;
        const maxHeight = options.maxHeight || APP_CONFIG.wordExportImage.wordImageMaxHeight;
        const marginTop = options.marginTop || APP_CONFIG.image.marginTop;
        const marginBottom = options.marginBottom || APP_CONFIG.image.marginBottom;
        return `<div style="margin:${esc(marginTop)} 0 ${esc(marginBottom)} 0;text-align:center;line-height:0;">
          <img src="${esc(resolvedSrc)}" alt="${esc(safeAlt)}" style="display:inline-block;border:0;max-width:${esc(maxWidth)};max-height:${esc(maxHeight)};width:auto;height:auto;" />
        </div>`;
      }

        const safeSrc = String(src || "").trim() || FRONT_IMAGE_DEFAULT_SRC;
        const safeAlt = String(alt || "").trim() || "Front cover image";

          maxWidth: APP_CONFIG.wordExportImage.wordFrontImageMaxWidth,

      async function buildWordSectionHtml(section) {

        if (section.kind === "church-info") {

        }
        if (section.kind === "sermon-info") {
          const sermonTitle = String(section.data.sermonTitle || "").trim();
          const speaker = String(section.data.speaker || "").trim();
          if (!sermonTitle && !speaker) return "";
          return `<div style="margin:0 0 10pt 0;">
            <p style="margin:0 0 5pt 0;font-size:${esc(TYPOGRAPHY.printSectionTitle)};font-weight:700;text-transform:uppercase;">${esc(section.title || "Sermon Information")}</p>
            ${sermonTitle ? `<p style="margin:0 0 4pt 0;font-weight:700;line-height:1.25;">${esc(sermonTitle)}</p>` : ""}

        }
        if (section.type === "announcement") {
          const items = (section.data.items || []).map(v => String(v || "").trim()).filter(Boolean);
          if (!items.length) return "";
          return `<div style="margin:0 0 10pt 0;">
            <p style="margin:0 0 5pt 0;font-size:${esc(TYPOGRAPHY.printSectionTitle)};font-weight:700;text-transform:uppercase;">${esc(section.title || "Section")}</p>
            <ul style="margin:0 0 0 18pt;padding:0;">${items.map(v => `<li style="margin:0 0 4pt 0;line-height:1.25;">${esc(v)}</li>`).join("")}</ul>
          </div>`;
        }
        if (section.type === "list") {
          const cols = section.data.columns === 3 ? 3 : 2;
          const rows = normalizeListRows(section.data.rows).filter(r => r.cells.some(v => String(v || "").trim()));
          if (!rows.length) return "";
          const rowHtml = rows.map(row => {
            const borderStyle = row.underline ? "border-bottom:1px dotted #a4a4a4;" : "border-bottom:none;";
            if (cols === 3) {
              return `<tr>
                <td style="width:33.33%;padding:1pt 2pt 1pt 0;text-align:left;vertical-align:top;${borderStyle}">${esc(row.cells[0] || "")}</td>
                <td style="width:33.33%;padding:1pt 2pt;text-align:center;vertical-align:top;${borderStyle}">${esc(row.cells[1] || "")}</td>
                <td style="width:33.33%;padding:1pt 0 1pt 2pt;text-align:right;vertical-align:top;white-space:nowrap;${borderStyle}">${esc(row.cells[2] || "")}</td>
              </tr>`;
            }
            return `<tr>
              <td style="width:64%;padding:1pt 2pt 1pt 0;text-align:left;vertical-align:top;${borderStyle}">${esc(row.cells[0] || "")}</td>
              <td style="width:36%;padding:1pt 0 1pt 2pt;text-align:right;vertical-align:top;white-space:nowrap;${borderStyle}">${esc(row.cells[1] || "")}</td>
            </tr>`;
          }).join("");
          return `<div style="margin:0 0 10pt 0;">
            <p style="margin:0 0 5pt 0;font-size:${esc(TYPOGRAPHY.printSectionTitle)};font-weight:700;text-transform:uppercase;">${esc(section.title || "Section")}</p>
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;width:100%;table-layout:fixed;">
              ${rowHtml}

          </div>`;
        }
        if (section.type === "image") {
          const src = String(section.data.src || "").trim();
          if (!src) return "";
          const alt = String(section.data.alt || "").trim() || "Bulletin image";
          return buildWordImageHtml(src, alt);
        }
        if (section.type === "front-image") {
          const src = String((section.data && section.data.src) || "").trim() || FRONT_IMAGE_DEFAULT_SRC;
          const alt = String((section.data && section.data.alt) || "").trim() || "Front cover image";
          const imageHtml = await buildWordFrontImageHtml(src, alt);
          return `<div style="width:100%;height:100%;text-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden;">
            ${imageHtml}
          </div>`;
        }
        const content = String(section.data.content || "").trim();
        if (!content) return "";
        return `<div style="margin:0 0 10pt 0;">
          <p style="margin:0 0 5pt 0;font-size:${esc(TYPOGRAPHY.printSectionTitle)};font-weight:700;text-transform:uppercase;">${esc(section.title || "Section")}</p>
          ${textToWordParagraphs(content)}

      }

      async function buildWordPanelHtml(sectionsForPage) {
        const sectionHtml = await Promise.all((sectionsForPage || []).map(buildWordSectionHtml));

      function buildWordSheetTable(leftHtml, rightHtml, rightIsFrontImage) {

        </table>`;

      function buildWordTriFoldTable(leftHtml, centerHtml, rightHtml, rightIsFrontImage) {
        const tri = APP_CONFIG.triFold;

        const rightPad = rightIsFrontImage ? "padding:0;" : panelPad;
        return `<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="width:100%;border-collapse:collapse;table-layout:fixed;margin:0;">
          <tr>
            <td style="width:${esc(tri.wordPanelWidth)};vertical-align:top;height:7.7in;${panelPad}font-size:${esc(TYPOGRAPHY.wordBody)};line-height:1.23;">${leftHtml || ""}</td>
            <td style="width:${esc(tri.wordPanelWidth)};vertical-align:top;height:7.7in;${panelPad}font-size:${esc(TYPOGRAPHY.wordBody)};line-height:1.23;">${centerHtml || ""}</td>
            <td style="width:${esc(tri.wordPanelWidth)};vertical-align:top;height:7.7in;${rightPad}font-size:${esc(TYPOGRAPHY.wordBody)};line-height:1.23;">${rightHtml || ""}</td>

      async function buildWordDocument(state) {
        const pages = getWordPageSections(state);
        if (layoutMode === "trifold-legal") {
          const frontTable = buildWordTriFoldTable(
            await buildWordPanelHtml(pages["front-left"]),
            await buildWordPanelHtml(pages["front-center"]),
            await buildWordPanelHtml(pages["front-right"]),
            !!(pages["front-right"].length && pages["front-right"][0].type === "front-image")
          );
          const backTable = buildWordTriFoldTable(
            await buildWordPanelHtml(pages["back-left"]),
            await buildWordPanelHtml(pages["back-center"]),
            await buildWordPanelHtml(pages["back-right"]),
            false
          );
          return `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="UTF-8"><meta name="ProgId" content="Word.Document"><meta name="Generator" content="Microsoft Word"><title>Church Bulletin</title>
          <style>
            @page SectionLandscape { size:14in 8.5in; mso-page-orientation:landscape; margin:${APP_CONFIG.printPageMargin.top} ${APP_CONFIG.printPageMargin.right} ${APP_CONFIG.printPageMargin.bottom} ${APP_CONFIG.printPageMargin.left}; }
            div.word-section { page: SectionLandscape; }
          </style></head><body style="margin:0;padding:0;font-family:Georgia,'Times New Roman',serif;color:#000;font-size:${esc(TYPOGRAPHY.wordBody)};">
            <div class="word-section">${frontTable}</div>
            <div style="page-break-before:always;"></div>
            <div class="word-section">${backTable}</div>
          </body></html>`;
        }
        const outerTable = buildWordSheetTable(
          await buildWordPanelHtml(pages.page4),
          await buildWordPanelHtml(pages.page1),
          !!(pages.page1.length && pages.page1[0].type === "front-image")
        );
        const innerTable = buildWordSheetTable(
          await buildWordPanelHtml(pages.page2),
          await buildWordPanelHtml(pages.page3),
          false
        );
        return `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="UTF-8"><meta name="ProgId" content="Word.Document"><meta name="Generator" content="Microsoft Word"><title>Church Bulletin</title>
        <style>
          @page SectionLandscape { size:11in 8.5in; mso-page-orientation:landscape; margin:${APP_CONFIG.printPageMargin.top} ${APP_CONFIG.printPageMargin.right} ${APP_CONFIG.printPageMargin.bottom} ${APP_CONFIG.printPageMargin.left}; }

          <div class="word-section">${outerTable}</div>
          <div style="page-break-before:always;"></div>
          <div class="word-section">${innerTable}</div>
        </body></html>`;
      }

      async function downloadWordDoc() {
        const state = getState();
        const doc = await buildWordDocument(state);
        const blob = new Blob(["﻿", doc], { type: "application/msword" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "church-bulletin.doc";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

          btn.textContent = "Copied HTML";
          setTimeout(() => { btn.textContent = old; }, 1200);
