<!DOCTYPE html>
<!--
  DEPENDENCIES
  Local files (same folder):
    - tools-nav.css  (optional - shared top nav styling; page works without it)
    - tools-nav.js  (optional - shared top nav + tool list; page works without it)
  External (internet):
    (none)
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule for Avery 8392</title>
  <style>
    :root {
      --bg: #eef3f8;
      --panel: #ffffff;
      --ink: #16354a;
      --ink-soft: #3c5566;
      --line: #c8d7e5;
      --blue-soft: #dceeff;
      --blue-mid: #4f97cf;
      --accent: #1f4f72;
      --danger: #ba2d2d;
      --card-w: 900px;
      --card-h: 1200px;
    }
 
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .app {
      max-width: 1120px;
      margin: 1rem auto;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      padding: 0.8rem;
      border-bottom: 1px solid var(--line);
      background: #f8fbff;
    }

    .toolbar label,
    .toolbar span {
      font-size: 0.8rem;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .fit-indicator {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--ink-soft);
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      border: 1px solid #c7d8e7;
      background: #f4f9ff;
    }

    .toolbar .grow { flex: 1 1 auto; }

    input[type="text"],
    input[type="file"],
    textarea,
    select,
    button {
      font: inherit;
      border: 1px solid #a8bfd1;
      background: #fff;
      color: var(--ink);
      padding: 0.45rem 0.55rem;
      border-radius: 8px;
    }

    input[type="text"],
    textarea,
    select { width: 100%; }

    .toolbar button,
    .editor button {
      cursor: pointer;
      font-weight: 700;
    }

    .toolbar button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .toolbar .back {
      margin-left: auto;
      text-decoration: none;
      color: var(--accent);
      border: 1px solid #a8bfd1;
      padding: 0.45rem 0.7rem;
      border-radius: 8px;
      font-weight: 700;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr minmax(320px, 390px);
      min-height: 620px;
    }

    .editor {
      padding: 0.9rem;
      border-right: 1px solid var(--line);
      background: #fbfdff;
      overflow: auto;
    }

    .hint {
      margin: 0 0 0.8rem;
      color: var(--ink-soft);
      font-size: 0.8rem;
      line-height: 1.35;
    }

    .dropzone {
      border: 2px dashed #90b3cf;
      border-radius: 10px;
      padding: 0.8rem;
      text-align: center;
      color: var(--ink-soft);
      margin-bottom: 0.8rem;
      font-size: 0.82rem;
      background: #f4f9ff;
    }

    .dropzone.active { background: #e7f3ff; border-color: var(--accent); }

    .day-editor {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 0.65rem;
      margin-bottom: 0.7rem;
    }

    .day-editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
    }

    .day-editor-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .row-editor {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.35rem;
      align-items: center;
      padding-left: 0.4rem;
      border-left: 3px solid transparent;
    }

    .row-editor input[type="text"]:first-child {
      min-width: 75px;
      max-width: 90px;
      width: 90px;
      flex: 0 0 auto;
    }

    .row-editor input[type="text"]:nth-child(2) {
      flex: 1 1 140px;
      min-width: 140px;
    }

    .row-editor select {
      min-width: 80px;
      width: auto;
      flex: 0 1 auto;
    }

    .row-editor .row-actions-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }

    .info-editor-wrap {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 0.65rem;
      margin-top: 0.8rem;
      margin-bottom: 0.7rem;
    }

    .info-editor-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 0.45rem;
    }

    .info-row-editor {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.35rem;
      align-items: center;
      padding-left: 0.4rem;
      border-left: 3px solid transparent;
    }

    .info-row-editor .info-text-input {
      flex: 1 1 140px;
      min-width: 140px;
    }

    .info-row-editor .info-type-select {
      min-width: 80px;
      width: auto;
      flex: 0 1 auto;
    }

    .info-row-editor .row-actions-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }

    .style-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.45rem 0.65rem;
      margin-top: 0.65rem;
      padding: 0.6rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ffffff;
    }

    .style-grid label {
      display: grid;
      gap: 0.24rem;
      font-size: 0.78rem;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .style-grid input[type="color"] {
      width: 100%;
      min-height: 2rem;
      padding: 0.15rem;
      border-radius: 8px;
    }

    .day-controls,
    .row-actions {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-top: 0.4rem;
    }

    .editor button.small { padding: 0.3rem 0.45rem; font-size: 0.75rem; }
    .editor button.danger { border-color: #dfa2a2; color: var(--danger); }

    .check-inline {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      color: var(--ink-soft);
      font-weight: 700;
      white-space: nowrap;
    }

    .check-inline input[type="checkbox"] {
      margin: 0;
      width: auto;
      accent-color: #b92b2b;
    }

    .preview-wrap {
      padding: 1rem;
      display: block;
      overflow: auto;
      background: #f0f5fb;
    }

    .preview-scroll-inner {
      min-width: max-content;
    }

    .card {
      width: 900px;
      height: 1200px;
      max-width: none;
      max-height: none;
      background: #fdfefe;
      border: 1px solid #c7d9e8;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 22px rgba(20, 60, 95, 0.12);
      overflow: hidden;
      --title-size: 52px;
      --section-header-size: 32px;
      --time-size: 24px;
      --activity-size: 22px;
      --footer-size: 15px;
      --row-gap: 10px;
      --section-gap: 10px;
      --card-padding: 16px;
      --card-gap: 14px;
      --row-pad-y: 3px;
      --header-padding-y: 13px;
      --header-padding-x: 14px;
      --panel-padding-y: 12px;
      --panel-padding-x: 14px;
      --footer-top-gap: 8px;
      --line-height-tightness: 1.2;
      --header-bg: #2f78af;
      --panel-bg: #ffffff;
      --header-text: #ffffff;
      --panel-border: #8bb4d7;
      --session-bg: #e8f7eb;
      --row-columns: 3;
      --content-scale: 1;
    }

    .preview-scale {
      width: 900px;
      height: 1200px;
      transform-origin: top left;
      transform: scale(var(--preview-scale, 0.4));
      flex: 0 0 auto;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      gap: var(--card-gap);
      padding: var(--card-padding);
      width: 100%;
      min-height: 100%;
      height: 100%;
      overflow: hidden;
      transform-origin: top center;
    }

    .card-title {
      width: 100%;
      text-align: center;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--header-text);
      background: var(--header-bg);
      border: 1px solid #215f90;
      min-height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0;
      padding: var(--header-padding-y) var(--header-padding-x);
      font-size: var(--title-size);
      text-transform: uppercase;
      line-height: var(--line-height-tightness);
      word-break: break-word;
    }

    .days {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--section-gap);
      min-height: 0;
      flex: 1 1 auto;
      overflow: visible;
      align-content: stretch;
      align-items: start;
    }

    .day {
      border: 1px solid var(--panel-border);
      border-radius: 0;
      overflow: hidden;
      background: var(--panel-bg);
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .day-header-wrap {
      padding: 0;
    }

    .day-header {
      background: var(--header-bg);
      color: var(--header-text);
      width: 100%;
      font-size: var(--section-header-size);
      font-weight: 800;
      text-align: center;
      padding: var(--header-padding-y) var(--header-padding-x);
      border-bottom: 1px solid var(--panel-border);
      border-radius: 0;
      line-height: var(--line-height-tightness);
      word-break: break-word;
    }

    .rows {
      padding: var(--panel-padding-y) var(--panel-padding-x);
      display: grid;
      gap: var(--row-gap) 12px;
      font-size: var(--activity-size);
      min-width: 0;
      grid-template-columns: repeat(var(--row-columns), minmax(0, 1fr));
    }

    .sched-row {
      display: flex;
      gap: 5px;
      align-items: start;
      padding: var(--row-pad-y) 0;
      min-width: 0;
      line-height: var(--line-height-tightness);
      background: transparent;
      break-inside: avoid;
    }

    .sched-row.bold {
      border-radius: 4px;
    }

    .time {
      font-weight: 700;
      color: #1f5e88;
      font-size: var(--time-size);
      white-space: nowrap;
      line-height: var(--line-height-tightness);
      flex: 0 0 auto;
      min-width: 0;
    }

    .activity {
      min-width: 0;
      color: #111;
      line-height: var(--line-height-tightness);
      word-break: normal;
      overflow-wrap: anywhere;
      flex: 1 1 auto;
      white-space: normal;
      font-size: var(--activity-size);
    }

    .sched-row.bold .time,
    .sched-row.bold .activity { font-weight: 800; }
    .sched-row.red .time,
    .sched-row.red .activity { color: #b02020; }

    .legend-panel {
      margin-top: 6px;
      border: 1px solid #8bb4d7;
      border-radius: 0;
      background: #fff;
      overflow: hidden;
      min-height: 0;
    }

    .legend-panel-header {
      background: var(--header-bg);
      color: var(--header-text);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-weight: 800;
      font-size: var(--footer-size);
      padding: var(--header-padding-y) var(--header-padding-x);
      border-bottom: 1px solid var(--panel-border);
      line-height: var(--line-height-tightness);
    }

    .legend-panel-body {
      color: #000;
      font-size: var(--footer-size);
      line-height: var(--line-height-tightness);
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
      padding: var(--info-padding-y) var(--info-padding-x);
      display: grid;
      gap: max(1px, calc(var(--row-gap) - 0.5px));
      min-height: 0.18in;
    }

    .legend-item {
      min-width: 0;
      line-height: var(--line-height-tightness);
      border-radius: 4px;
      padding: 1px 2px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .legend-item.bold {
      font-weight: 800;
    }

    .legend-item.session {
      background: var(--session-bg);
    }

    .legend-item.red {
      color: #b02020;
    }

    .row-editor.row-type-bold,
    .info-row-editor.row-type-bold {
      border-left-color: #1f4f72;
    }

    .row-editor.row-type-session,
    .info-row-editor.row-type-session {
      border-left-color: #4caf6e;
    }

    .empty {
      color: #5f778a;
      text-align: center;
      font-size: 0.1in;
      padding: 0.2in 0.06in;
    }

    .fit-warning {
      margin-top: 0.55rem;
      color: #7f1d1d;
      font-size: 0.78rem;
      font-weight: 700;
      display: none;
    }

    @media (max-width: 960px) {
      .content { grid-template-columns: 1fr; }
      .editor { border-right: none; border-bottom: 1px solid var(--line); max-height: none; }
      .toolbar .back { margin-left: 0; }
    }

    @page {
      size: 3in 5in;
      margin: 0;
    }

    @media print {
      html, body {
        width: 3in;
        height: 5in;
        background: #fff;
        margin: 0;
        padding: 0;
      }

      body * { visibility: hidden !important; }
      #cardPreview, #cardPreview * { visibility: visible !important; }

      .app {
        border: none;
        margin: 0;
        max-width: none;
      }

      .toolbar,
      .editor,
      .hint-print,
      #previewDebug {
        display: none !important;
      }

      .content {
        display: block;
        min-height: 0;
      }

      .preview-wrap {
        background: #fff;
        padding: 0;
        display: block;
      }

      #cardPreview {
        width: 3in !important;
        height: 5in !important;
        aspect-ratio: auto;
        border: none;
        border-radius: 0;
        box-shadow: none;
        margin: 0;
        overflow: visible;
      }
    }
  </style>

<body>
  <main class="app">
    <div class="toolbar no-print">
      <label>
        CSV Upload
        <input id="csvInput" type="file" accept=".csv,text/csv" />
      </label>
      <button id="sampleBtn" type="button">Load Sample</button>
      <label>
        Export Format
        <select id="exportFormatSelect">
          <option value="png">PNG</option>
          <option value="jpg">JPG</option>
        </select>
      </label>
      <button id="exportPngBtn" type="button" class="primary">Download PNG</button>
      <button id="exportJpgBtn" type="button" class="primary">Download JPG</button>
      <span id="fitIndicator" class="fit-indicator" aria-live="polite">Fit: Normal</span>
      <label>
        Starting Text Size
        <input id="textScaleInput" type="number" step="0.05" min="0.75" max="1.75" value="1.15" />
      </label>
      <button id="resetBtn" type="button">Reset</button>
      
    </div>

    <div class="content">
      <section class="editor no-print" aria-label="Schedule editor">
        <p class="hint">Upload a CSV with columns: <strong>day, date, time, activity, type</strong> and optional <strong>red</strong>. Edit anything below. Best results: print/save PDF at <strong>100% scale</strong>.</p>
        <div id="fitWarning" class="fit-warning" role="status" aria-live="polite"></div>
        <div id="dropzone" class="dropzone" tabindex="0">Drag and drop a CSV file here</div>

        <label>
          Card Title
          <input id="titleInput" type="text" maxlength="56" />
        </label>

        <div class="style-grid" aria-label="Style options">
          <label>
            Header Background
            <input id="headerBgInput" type="color" value="#dceeff" />
          </label>
          <label>
            Header Text
            <input id="headerTextInput" type="color" value="#194665" />
          </label>
          <label>
            Panel Background
            <input id="panelBgInput" type="color" value="#fcfeff" />
          </label>
          <label>
            Panel Border
            <input id="panelBorderInput" type="color" value="#c2d7eb" />
          </label>
          <label>
            Session Highlight
            <input id="sessionBgInput" type="color" value="#e8f7eb" />
          </label>
          <label>
            Info Panel Title
            <input id="infoPanelTitleInput" type="text" maxlength="48" value="ADDITIONAL INFORMATION" />
          </label>
          <label class="check-inline">
            <input id="showInfoPanelInput" type="checkbox" checked />
            Show Additional Info Panel
          </label>
        </div>

        <div class="info-editor-wrap" aria-label="Additional Information editor">
          <div class="info-editor-title">Additional Information</div>
          <div id="infoEditor"></div>
          <div class="day-controls">
            <button id="addInfoRowBtn" type="button" class="small">+ Add Info Row</button>
          </div>
        </div>

        <div id="daysEditor" style="margin-top:0.8rem;"></div>
        <div class="day-controls">
          <button id="addDayBtn" type="button">+ Add Day</button>
        </div>
      </section>

      <section class="preview-wrap">
        <div class="preview-scroll-inner">
          <div id="previewDebug" style="font-weight:700;margin-bottom:8px;color:#1f4f72"></div>
          <div class="preview-scale">
            <article id="cardPreview" class="card" aria-label="900 by 1200 schedule preview"></article>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    (function () {
      const defaultState = () => ({
        title: "SCHEDULE",
        infoItems: [],
        showInfoPanel: true,
        infoPanelTitle: "ADDITIONAL INFORMATION",
        colors: {
          headerBg: "#dceeff",
          headerText: "#194665",
          panelBg: "#fcfeff",
          panelBorder: "#c2d7eb",
          sessionBg: "#e8f7eb"
        },
        days: []
      });

      let state = defaultState();
      let uid = 0;

      const elements = {
        csvInput: document.getElementById("csvInput"),
        sampleBtn: document.getElementById("sampleBtn"),
        exportFormatSelect: document.getElementById("exportFormatSelect"),
        exportPngBtn: document.getElementById("exportPngBtn"),
        exportJpgBtn: document.getElementById("exportJpgBtn"),
        resetBtn: document.getElementById("resetBtn"),
        titleInput: document.getElementById("titleInput"),
        infoEditor: document.getElementById("infoEditor"),
        addInfoRowBtn: document.getElementById("addInfoRowBtn"),
        headerBgInput: document.getElementById("headerBgInput"),
        headerTextInput: document.getElementById("headerTextInput"),
        panelBgInput: document.getElementById("panelBgInput"),
        panelBorderInput: document.getElementById("panelBorderInput"),
        sessionBgInput: document.getElementById("sessionBgInput"),
        infoPanelTitleInput: document.getElementById("infoPanelTitleInput"),
        showInfoPanelInput: document.getElementById("showInfoPanelInput"),
        fitWarning: document.getElementById("fitWarning"),
        daysEditor: document.getElementById("daysEditor"),
        addDayBtn: document.getElementById("addDayBtn"),
        cardPreview: document.getElementById("cardPreview"),
        dropzone: document.getElementById("dropzone"),
        fitIndicator: document.getElementById("fitIndicator"),
        previewDebug: document.getElementById("previewDebug"),
        textScaleInput: null
      };

      const fitDefaults = {
        titleSize: 36,
        sectionHeaderSize: 24,
        timeSize: 19,
        activitySize: 18,
        footerSize: 13,
        rowGap: 5,
        sectionGap: 10,
        cardPadding: 12,
        cardGap: 10,
        rowPadY: 3,
        headerPaddingY: 11,
        headerPaddingX: 10,
        panelPaddingY: 10,
        panelPaddingX: 10,
        footerTopGap: 8,
        lineHeightTightness: 1.2
      };

      const fitMins = {
        titleSize: 25,
        sectionHeaderSize: 16,
        timeSize: 13,
        activitySize: 13,
        footerSize: 10,
        rowGap: 2,
        sectionGap: 3,
        cardPadding: 4,
        cardGap: 4,
        rowPadY: 1,
        headerPaddingY: 4,
        headerPaddingX: 4,
        panelPaddingY: 4,
        panelPaddingX: 3.6,
        footerTopGap: 0,
        lineHeightTightness: 1.02
      };

      const TEXT_SCALE_DEFAULT = 1.15;
      let textScale = TEXT_SCALE_DEFAULT;

      let fitRafId = null;
      let exportInProgress = false;
      function updatePreviewScale() {
        const wrap = document.querySelector(".preview-wrap");
        const scaleNode = document.querySelector(".preview-scale");
        if (!wrap || !scaleNode) return;

        const availableWidth = Math.max(260, wrap.clientWidth - 32);
        const availableHeight = Math.max(360, window.innerHeight - 190);

        const scale = Math.min(1, availableWidth / 900, availableHeight / 1200);

        scaleNode.style.setProperty("--preview-scale", String(scale));
        scaleNode.style.width = "900px";
        scaleNode.style.height = "1200px";

        const inner = document.querySelector(".preview-scroll-inner");
        if (inner) {
          inner.style.width = `${Math.ceil(900 * scale)}px`;
          inner.style.minWidth = `${Math.ceil(900 * scale)}px`;
        }
      }

      function nextId(prefix) {
        uid += 1;
        return `${prefix}-${uid}`;
      }

      function escapeCell(value) {
        return String(value || "").trim();
      }

      function normalizeText(value) {
        const text = String(value ?? "").trim();
        return text || "";
      }

      function buildSectionLabel(day, date) {
        const safeDay = normalizeText(day);
        const safeDate = normalizeText(date);
        if (safeDay && safeDate) return `${safeDay}, ${safeDate}`;
        if (safeDay) return safeDay;
        if (safeDate) return safeDate;
        return "Untitled Day";
      }

      function getRecordField(record, fieldName) {
        if (!record || typeof record !== "object") return "";
        return normalizeText(record[fieldName]);
      }

      function parseCSV(text) {
        const rows = [];
        let current = "";
        let row = [];
        let inQuotes = false;

        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          const next = text[i + 1];

          if (char === '"') {
            if (inQuotes && next === '"') {
              current += '"';
              i += 1;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === "," && !inQuotes) {
            row.push(current);
            current = "";
          } else if ((char === "\n" || char === "\r") && !inQuotes) {
            if (char === "\r" && next === "\n") i += 1;
            row.push(current);
            if (row.some(cell => cell.length > 0)) rows.push(row);
            row = [];
            current = "";
          } else {
            current += char;
          }
        }

        if (current.length > 0 || row.length > 0) {
          row.push(current);
          if (row.some(cell => cell.length > 0)) rows.push(row);
        }

        if (!rows.length) return [];

        const headers = rows[0].map(h => escapeCell(h).toLowerCase());
        return rows.slice(1).map(values => {
          const obj = {};
          headers.forEach((header, idx) => {
            obj[header] = escapeCell(values[idx] || "");
          });
          return obj;
        });
      }

      function normalizeType(type) {
        const value = String(type || "regular").toLowerCase();
        if (value === "bold" || value === "session") return value;
        return "regular";
      }

      function parseRedValue(value) {
        const normalized = normalizeText(value).toLowerCase();
        return ["true", "yes", "1", "red"].includes(normalized);
      }

      function buildStateFromCSV(records) {
        const map = new Map();
        const days = [];

        records.forEach(record => {
          const day = getRecordField(record, "day");
          const date = getRecordField(record, "date");
          const key = `${day}__${date}`;
          if (!map.has(key)) {
            const group = { id: nextId("day"), day, date, rows: [] };
            map.set(key, group);
            days.push(group);
          }

          map.get(key).rows.push({
            id: nextId("row"),
            time: getRecordField(record, "time"),
            activity: getRecordField(record, "activity"),
            type: normalizeType(getRecordField(record, "type")),
            isRed: parseRedValue(getRecordField(record, "red"))
          });
        });

        if (!days.length) {
          days.push({
            id: nextId("day"),
            day: "Tuesday",
            date: "Sept. 16",
            rows: [{ id: nextId("row"), time: "7:00 PM", activity: "Welcome & Opening Music", type: "bold", isRed: false }]
          });
        }

        state.days = days;
      }

      function applyFitVars(values) {
        const card = elements.cardPreview;
        card.style.setProperty("--title-size", `${values.titleSize}px`);
        card.style.setProperty("--section-header-size", `${values.sectionHeaderSize}px`);
        card.style.setProperty("--time-size", `${values.timeSize}px`);
        card.style.setProperty("--activity-size", `${values.activitySize}px`);
        card.style.setProperty("--footer-size", `${values.footerSize}px`);
        card.style.setProperty("--row-gap", `${values.rowGap}px`);
        card.style.setProperty("--section-gap", `${values.sectionGap}px`);
        card.style.setProperty("--card-padding", `${values.cardPadding}px`);
        card.style.setProperty("--card-gap", `${values.cardGap}px`);
        card.style.setProperty("--row-pad-y", `${values.rowPadY}px`);
        card.style.setProperty("--header-padding-y", `${values.headerPaddingY}px`);
        card.style.setProperty("--header-padding-x", `${values.headerPaddingX}px`);
        card.style.setProperty("--panel-padding-y", `${values.panelPaddingY}px`);
        card.style.setProperty("--panel-padding-x", `${values.panelPaddingX}px`);
        card.style.setProperty("--footer-top-gap", `${values.footerTopGap}px`);
        card.style.setProperty("--line-height-tightness", String(values.lineHeightTightness));
      }

      function reduceScheduleFit(values) {
        const next = { ...values };

        const scheduleTextKeys = ["titleSize", "sectionHeaderSize", "timeSize", "activitySize"];
        scheduleTextKeys.forEach((key) => {
          if (next[key] > fitMins[key]) next[key] = Math.max(fitMins[key], next[key] - 0.1);
        });

        const scheduleSpacingKeys = ["rowGap", "sectionGap", "cardPadding", "cardGap", "rowPadY", "headerPaddingY", "headerPaddingX", "panelPaddingY", "panelPaddingX", "footerTopGap"];
        scheduleSpacingKeys.forEach((key) => {
          if (next[key] > fitMins[key]) next[key] = Math.max(fitMins[key], next[key] - 0.13);
        });

        if (next.lineHeightTightness > fitMins.lineHeightTightness) next.lineHeightTightness = Math.max(fitMins.lineHeightTightness, next.lineHeightTightness - 0.01);

        return next;
      }

      function isAtMin(values) {
        return Object.keys(fitMins).every(key => {
          const current = Number(values[key]);
          return current <= fitMins[key] + 0.0001;
        });
      }

      function isAtMinForKeys(values, keys) {
        return keys.every((key) => {
          const current = Number(values[key]);
          return current <= fitMins[key] + 0.0001;
        });
      }

      function updateFitIndicator(level) {
        elements.fitIndicator.textContent = `Fit: ${level}`;
      }

      function toInfoItem(raw) {
        const textFromField = normalizeText(raw && raw.text);
        const legacyTitle = normalizeText(raw && raw.title);
        const legacyInfo = normalizeText(raw && raw.info);
        const legacyCombined = [legacyTitle, legacyInfo].filter(Boolean).join(": ");
        return {
          id: normalizeText(raw && raw.id) || nextId("info"),
          text: textFromField || legacyCombined,
          type: normalizeType(raw && raw.type),
          isRed: !!(raw && raw.isRed)
        };
      }

      function ensureInfoItemsShape() {

        for (let i = 0; i < state.infoItems.length; i += 1) {
          state.infoItems[i] = toInfoItem(state.infoItems[i]);
        }
      }

      function syncInfoItemsFromEditor() {
        const infoEditor = elements.infoEditor;
        if (!infoEditor) return;
        const infoRows = Array.from(infoEditor.querySelectorAll(".info-row-editor[data-info-id]"));
        if (!infoRows.length) return;

        const synced = [];
        const usedIds = new Set();

        infoRows.forEach((row) => {
          const rawId = normalizeText(row.dataset.infoId);
          const id = rawId && !usedIds.has(rawId) ? rawId : nextId("info");
          usedIds.add(id);

          const textInput = row.querySelector(".info-text-input");
          const typeSelect = row.querySelector(".info-type-select");
          const redCheckbox = row.querySelector(".info-red-checkbox");

          synced.push({
            id,
            text: textInput ? String(textInput.value || "") : "",
            type: normalizeType(typeSelect ? typeSelect.value : "regular"),
            isRed: !!(redCheckbox && redCheckbox.checked)
          });
        });

        state.infoItems = synced;
        ensureInfoItemsShape();
      }

      function moveInfoRowUp(index) {
        syncInfoItemsFromEditor();
        ensureInfoItemsShape();
        if (index <= 0 || index >= state.infoItems.length) return;
        [state.infoItems[index - 1], state.infoItems[index]] = [state.infoItems[index], state.infoItems[index - 1]];

      function moveInfoRowDown(index) {
        syncInfoItemsFromEditor();

        if (index < 0 || index >= state.infoItems.length - 1) return;

      function getFitMeasurements() {
        const card = elements.cardPreview;
        const cardContent = card.querySelector(".card-content");
        const daysWrap = card.querySelector(".days");
        const sections = Array.from(card.querySelectorAll(".day"));
        const infoBox = card.querySelector(".legend-panel");
        const infoBody = card.querySelector(".legend-panel-body");

        if (!cardContent || !daysWrap) {
          return {
            overflow: false,
            cardOverflow: false,
            daysOverflow: false,
            sectionsOverflow: false,
            infoOverflow: false
          };
        }

        const overflowEpsilon = 0.5;
        const cardOverflow = cardContent.scrollHeight > cardContent.clientHeight + overflowEpsilon;
        const daysOverflow = daysWrap.scrollHeight > daysWrap.clientHeight + overflowEpsilon;
        const sectionsOverflow = sections.some((section) => {
          const rows = section.querySelector(".rows");
          const sectionClip = section.scrollHeight > section.clientHeight + overflowEpsilon;
          const rowsClip = !!rows && (rows.scrollHeight > rows.clientHeight + overflowEpsilon);
          return sectionClip || rowsClip;
        });
        const scheduleOverflow = daysOverflow || sectionsOverflow;

        const infoBodyOverflow = !!infoBody && (infoBody.scrollHeight > infoBody.clientHeight + overflowEpsilon);
        const infoPanelOverflow = !!infoBox && (infoBox.scrollHeight > infoBox.clientHeight + overflowEpsilon);
        const infoOverflow = infoBodyOverflow || infoPanelOverflow;
        const overflow = cardOverflow || scheduleOverflow || infoOverflow;

        return {
          overflow,
          cardOverflow,
          scheduleOverflow,
          daysOverflow,
          sectionsOverflow,
          infoBodyOverflow,
          infoPanelOverflow,
          infoOverflow
        };
      }

      function fitCardToPage() {
        const card = elements.cardPreview;
        const content = card.querySelector(".card-content");
        if (!content) return;

        let values = {
          ...fitDefaults,
          titleSize: fitDefaults.titleSize * textScale,
          sectionHeaderSize: fitDefaults.sectionHeaderSize * textScale,
          timeSize: fitDefaults.timeSize * textScale,
          activitySize: fitDefaults.activitySize * textScale,
          footerSize: fitDefaults.footerSize * textScale
        };
        applyFitVars(values);

        let iterations = 0;
        let measures = getFitMeasurements();

        if (!measures.overflow) {
          updateFitIndicator("Normal");
          return;
        }

        const scheduleKeys = ["titleSize", "sectionHeaderSize", "timeSize", "activitySize", "rowGap", "sectionGap", "cardPadding", "cardGap", "rowPadY", "headerPaddingY", "headerPaddingX", "panelPaddingY", "panelPaddingX", "footerTopGap", "lineHeightTightness"];

        while (measures.scheduleOverflow && iterations < 320) {
          if (isAtMinForKeys(values, scheduleKeys) || isAtMin(values)) break;
          values = reduceScheduleFit(values);
          applyFitVars(values);
          measures = getFitMeasurements();
          iterations += 1;
        }

        const compactness = (fitDefaults.activitySize - values.activitySize) / ((fitDefaults.activitySize - fitMins.activitySize) || 1);
        card.style.setProperty("--content-scale", "1");
        measures = getFitMeasurements();
        if (elements.fitWarning) {
          if (measures.overflow) {
            elements.fitWarning.style.display = "block";
            elements.fitWarning.textContent =
              "Content could not fully fit at minimum text sizes.";
          } else {
            elements.fitWarning.style.display = "none";
            elements.fitWarning.textContent = "";
          }
        }
        if (compactness < 0.25) updateFitIndicator("Normal");
        else if (compactness < 0.7) updateFitIndicator("Compact");
        else updateFitIndicator("Very Compact");
      }

      function scheduleFit() {
        if (fitRafId) cancelAnimationFrame(fitRafId);
        fitRafId = requestAnimationFrame(() => {
          fitRafId = null;
          fitCardToPage();
        });
      }

          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "Upload CSV or load sample data.";
          daysWrap.appendChild(empty);
        } else {
          state.days.forEach(day => {
            const visibleRows = day.rows.filter((row) => normalizeText(row.time) || normalizeText(row.activity));
            if (!visibleRows.length) return;
            const dayEl = document.createElement("section");
            dayEl.className = "day";

            const headerWrap = document.createElement("div");
            headerWrap.className = "day-header-wrap";

            const header = document.createElement("div");
            header.className = "day-header";
            header.textContent = buildSectionLabel(day.day || day.label, day.date);
            headerWrap.appendChild(header);

            const rowsEl = document.createElement("div");
            rowsEl.className = "rows";
            const maxChars = Math.max(0, ...visibleRows.map((row) => `${row.time || ""} ${row.activity || ""}`.length));
            let rowColumns = 3;
            if (visibleRows.length > 16 || maxChars > 66) rowColumns = 2;
            if (visibleRows.length > 24 || maxChars > 92) rowColumns = 1;
            rowsEl.style.setProperty("--row-columns", String(rowColumns));

            visibleRows.forEach((row) => {
              const hasTime = normalizeText(row.time);
              const hasActivity = normalizeText(row.activity);
              if (!hasTime && !hasActivity) return;
              const rowEl = document.createElement("div");
              rowEl.className = `sched-row ${normalizeType(row.type)}${row.isRed ? " red" : ""}`;

              const time = document.createElement("div");
              time.className = "time";
              time.textContent = hasTime || "--";

              const activity = document.createElement("div");
              activity.className = "activity";
              activity.textContent = hasActivity || "";
              if (normalizeType(row.type) === "session") {
                activity.style.background = "var(--session-bg)";
                activity.style.padding = "0 4px";
                activity.style.borderRadius = "3px";
              }

              rowEl.append(time, activity);
              rowsEl.appendChild(rowEl);
            });

            dayEl.append(headerWrap, rowsEl);
            daysWrap.appendChild(dayEl);
          });
        }

        cardContent.append(title, daysWrap);

        const hasSessionRows = state.days.some((day) => day.rows.some((row) => normalizeType(row.type) === "session"));
        const shouldShowLegend = hasSessionRows && rowCount <= 18 && dayCount <= 4;
        if (shouldShowLegend) {
          const legendPanel = document.createElement("div");
          legendPanel.className = "legend-panel";

          const legendHeader = document.createElement("div");
          legendHeader.className = "legend-panel-header";
          legendHeader.textContent = "LEGEND";

          const legendBody = document.createElement("div");
          legendBody.className = "legend-panel-body";

          const regular = document.createElement("div");
          regular.className = "legend-item";
          regular.textContent = "Regular = Standard schedule item";

          const session = document.createElement("div");
          session.className = "legend-item session";
          session.textContent = "Session = Special session highlight";

          legendBody.append(regular, session);
          legendPanel.append(legendHeader, legendBody);
          cardContent.appendChild(legendPanel);
        }

        card.appendChild(cardContent);
        elements.cardPreview.style.setProperty("--content-scale", "1");
        scheduleFit();
      }

      function applyEditorTypeClass(rowElement, rowType) {
        rowElement.classList.remove("row-type-bold", "row-type-session");
        const normalizedType = normalizeType(rowType);
        if (normalizedType === "bold") rowElement.classList.add("row-type-bold");
        if (normalizedType === "session") rowElement.classList.add("row-type-session");
      }

      function renderAll() {
        renderEditor();
        renderPreview();
      }

      function getSafeFilenameBase() {
        const fallback = "schedule";
        const title = normalizeText(state.title).toLowerCase();
        const slug = title
          .replace(/['"]/g, "")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 64);
        return slug || fallback;
      }

      function waitForNextFrame() {
        return new Promise(resolve => requestAnimationFrame(() => resolve()));
      }

      function getCardStyleText() {
        return Array.from(document.querySelectorAll("style"))
          .map(node => node.textContent || "")
          .join("\n");
      }

      async function renderCardToCanvas(outputWidth = 900, outputHeight = 1200) {
        const card = elements.cardPreview;
        await waitForNextFrame();

        const width = 900;
        const height = 1200;
        const outWidth = outputWidth;
        const outHeight = outputHeight;

        const clone = card.cloneNode(true);
        clone.id = "cardPreviewCapture";
        clone.style.width = "900px";
        clone.style.height = "1200px";
        clone.style.margin = "0";
        clone.style.transform = "none";

        const styleText = getCardStyleText();
        const xhtml = `
          <div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;height:${height}px;overflow:hidden;">
            <style>${styleText}</style>
            ${clone.outerHTML}
          </div>
        `;

        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
            <foreignObject x="0" y="0" width="${width}" height="${height}">${xhtml}</foreignObject>
          </svg>
        `;

        const dataUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        const image = new Image();
        image.decoding = "sync";

        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = reject;
          image.src = dataUrl;
        });

        const canvas = document.createElement("canvas");
        canvas.width = outWidth;
        canvas.height = outHeight;

        const context = canvas.getContext("2d");
        if (!context) throw new Error("Could not create export canvas.");
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, outWidth, outHeight);
        context.drawImage(image, 0, 0, outWidth, outHeight);
        return canvas;
      }

      function canvasToJpegDataUrl(canvas, quality = 0.92) {
        return canvas.toDataURL("image/jpeg", quality);
      }

      function dataUrlToBytes(dataUrl) {
        const base64 = dataUrl.split(",")[1] || "";
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function getJpegDimensions(bytes) {
        let offset = 2;
        while (offset < bytes.length - 9) {
          if (bytes[offset] !== 0xFF) {
            offset += 1;
            continue;
          }
          const marker = bytes[offset + 1];
          const blockLength = (bytes[offset + 2] << 8) + bytes[offset + 3];
          const isSof = marker >= 0xC0 && marker <= 0xC3;
          if (isSof) {
            const height = (bytes[offset + 5] << 8) + bytes[offset + 6];
            const width = (bytes[offset + 7] << 8) + bytes[offset + 8];
            return { width, height };
          }
          offset += 2 + blockLength;
        }
        return { width: 900, height: 1500 };
      }

      function buildFlattenedPdf(jpegBytes) {
        const pageWidthPt = 216;
        const pageHeightPt = 360;
        const dims = getJpegDimensions(jpegBytes);

        const objects = [];
        const addObject = (body) => {
          objects.push(body);
          return objects.length;
        };

        const catalogRef = addObject("<< /Type /Catalog /Pages 2 0 R >>");
        const pagesRef = addObject("<< /Type /Pages /Count 1 /Kids [3 0 R] >>");
        const pageRef = addObject(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidthPt} ${pageHeightPt}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>`);
        const contentStream = `q\n${pageWidthPt} 0 0 ${pageHeightPt} 0 0 cm\n/Im0 Do\nQ\n`;
        const contentRef = addObject(`<< /Length ${contentStream.length} >>\nstream\n${contentStream}endstream`);
        const imageHeader = `<< /Type /XObject /Subtype /Image /Width ${dims.width} /Height ${dims.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`;
        const imageFooter = "\nendstream";

        const header = "%PDF-1.4\n";
        const chunks = [header];
        const offsets = [0];

        for (let i = 0; i < objects.length; i += 1) {
          offsets.push(chunks.join("").length);
          chunks.push(`${i + 1} 0 obj\n${objects[i]}\nendobj\n`);
        }

        offsets.push(chunks.join("").length);
        chunks.push(`5 0 obj\n${imageHeader}`);

        const prefix = chunks.join("");
        const suffix = `${imageFooter}\nendobj\n`;
        const xrefStart = prefix.length + jpegBytes.length + suffix.length;

        const xref = [
          "xref\n",
          `0 ${objects.length + 2}\n`,
          "0000000000 65535 f \n",
          ...offsets.slice(1).map(n => `${String(n).padStart(10, "0")} 00000 n \n`),
          `${String(prefix.length).padStart(10, "0")} 00000 n \n`,
          "trailer\n",
          `<< /Size ${objects.length + 2} /Root ${catalogRef} 0 R >>\n`,
          "startxref\n",
          `${xrefStart}\n`,
          "%%EOF"
        ].join("");

        const encoder = new TextEncoder();
        return new Blob(
          [encoder.encode(prefix), jpegBytes, encoder.encode(`${suffix}${xref}`)],
          { type: "application/pdf" }
        );
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function downloadCanvas(canvas, filename, type = "image/png", quality = 0.95) {
        const link = document.createElement("a");
        link.download = filename;
        link.href = type === "image/png" ? canvas.toDataURL(type) : canvas.toDataURL(type, quality);
        link.click();
      }

      async function exportPng() {
        const canvas = await renderCardToCanvas(900, 1200);
        downloadCanvas(canvas, `${getSafeFilenameBase()}.png`, "image/png");
      }

      async function exportJpg() {
        const canvas = await renderCardToCanvas(900, 1200);
        downloadCanvas(canvas, `${getSafeFilenameBase()}.jpg`, "image/jpeg", 0.95);
      }

      async function handleExport(format) {
        if (exportInProgress) return;
        exportInProgress = true;
        try {
          if (format === "jpg") await exportJpg();
          else await exportPng();
        } catch (error) {
          console.error(error);
          alert("Sorry, export failed in this browser.");
        } finally {
          exportInProgress = false;
        }
      }






      function parseAndApplyCsvText(csvText) {
        const records = parseCSV(csvText);
        state = defaultState();
        buildStateFromCSV(records);
        renderAll();
      }

      function isCsvFile(file) {
        if (!file) return false;
        const name = String(file.name || "").toLowerCase();
        const type = String(file.type || "").toLowerCase();
        return name.endsWith(".csv") || type.includes("csv");
      }

      function processCsvFile(file) {
        if (!file) return;
        if (!isCsvFile(file)) {
          alert("Please upload a CSV file (.csv).");
          return;
        }
        const reader = new FileReader();
        reader.onload = () => parseAndApplyCsvText(String(reader.result || ""));
        reader.onerror = () => alert("Could not read that file. Please try another CSV.");
        reader.readAsText(file);
      }

      function bindDragDrop() {
        const preventDragDefaults = (event) => {
          event.preventDefault();
          event.stopPropagation();
          if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
        };
        [document, window, elements.dropzone].forEach((target) => {
          ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
            target.addEventListener(eventName, preventDragDefaults);
          });
        });

        ["dragenter", "dragover"].forEach((eventName) => {
          elements.dropzone.addEventListener(eventName, () => elements.dropzone.classList.add("active"));
        });
        ["dragleave", "drop"].forEach((eventName) => {
          elements.dropzone.addEventListener(eventName, () => elements.dropzone.classList.remove("active"));
        });

        elements.dropzone.addEventListener("drop", (event) => {
          const files = event.dataTransfer?.files ? Array.from(event.dataTransfer.files) : [];
          if (!files.length) return;
          processCsvFile(files[0]);
        });
      }

      function bindEvents() {
        window.addEventListener("resize", updatePreviewScale);
        elements.sampleBtn.addEventListener("click", loadSample);
        elements.exportPngBtn.addEventListener("click", () => handleExport("png"));
        elements.exportJpgBtn.addEventListener("click", () => handleExport("jpg"));
        elements.resetBtn.addEventListener("click", () => { state = defaultState(); renderAll(); });
        elements.addDayBtn.addEventListener("click", addDay);
        elements.addInfoRowBtn.addEventListener("click", addInfoRow);
        elements.csvInput.addEventListener("change", (event) => {
          const [file] = event.target.files || [];
          processCsvFile(file);
          event.target.value = "";
        });

        elements.titleInput.addEventListener("input", (event) => { state.title = event.target.value; renderPreview(); });
        elements.headerBgInput.addEventListener("input", (event) => { state.colors.headerBg = event.target.value; renderPreview(); });
        elements.headerTextInput.addEventListener("input", (event) => { state.colors.headerText = event.target.value; renderPreview(); });
        elements.panelBgInput.addEventListener("input", (event) => { state.colors.panelBg = event.target.value; renderPreview(); });
        elements.panelBorderInput.addEventListener("input", (event) => { state.colors.panelBorder = event.target.value; renderPreview(); });
        elements.sessionBgInput.addEventListener("input", (event) => { state.colors.sessionBg = event.target.value; renderPreview(); });
        elements.infoPanelTitleInput.addEventListener("input", (event) => { state.infoPanelTitle = event.target.value; renderPreview(); });
        elements.showInfoPanelInput.addEventListener("change", (event) => { state.showInfoPanel = !!event.target.checked; renderPreview(); });

        elements.textScaleInput = document.getElementById("textScaleInput");
        if (elements.textScaleInput) {
          elements.textScaleInput.value = String(textScale);
          elements.textScaleInput.addEventListener("input", (event) => {
            textScale = Math.max(0.75, Math.min(1.75, parseFloat(event.target.value) || TEXT_SCALE_DEFAULT));
            renderPreview();
          });
        }

        bindDragDrop();
      }

      function init() {
        renderAll();
        bindEvents();
        updatePreviewScale();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init, { once: true });
      } else {
        init();
      }
    })();
  </script>
